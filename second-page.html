<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video — Amai Studio</title>
  <style>
    :root { --header-offset: 300px; } /* safer fallback before JS runs */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      line-height: 1.6;
      color: #8B7355;
      background: #FAF4F4;
      background-image: url('./Background.png');
      background-size: 200px 200px;
      background-repeat: repeat;
      overflow-x: hidden;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Language Toggle */
    .language-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 25px; padding: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      display: flex; gap: 6px; align-items: center;
    }
    .language-toggle button {
      background: none; border: none; padding: 8px 16px;
      border-radius: 20px; cursor: pointer; transition: 0.3s;
      font-weight: 500; color: #8B7355;
    }
    .language-toggle button.active { background: #D4AF8C; color: #fff; }
    .language-toggle button:hover { background: #E8D5C4; }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      position: fixed; width: 100%; top: 0; z-index: 999;
      box-shadow: 0 4px 30px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, background 0.3s ease;
      min-height: 40px;
    }
    nav {
      padding: 0.5rem 0; display: flex; justify-content: space-between; align-items: center;
      min-height: 60px;
    }
    .logo { display: flex; align-items: center; gap: 1rem; }
    .logo img { height: 200px; width: auto; border-radius: 3px; }

    .nav-links { display: flex; list-style: none; gap: 2rem; }
    .nav-links a {
      text-decoration: none; color: #8B7355; font-weight: 500;
      transition: all 0.3s ease; position: relative;
    }
    .nav-links a:hover { color: #D4AF8C; transform: translateY(-2px); }
    .nav-links a::after {
      content: ''; position: absolute; width: 0; height: 2px; bottom: -5px; left: 50%;
      background: #D4AF8C; transition: all 0.3s ease; transform: translateX(-50%);
    }
    .nav-links a:hover::after { width: 100%; }

    /* Hamburger */
    .hamburger { display: none; flex-direction: column; cursor: pointer; z-index: 1001; }
    .hamburger span { height: 3px; width: 25px; background: #8B7355; margin: 4px 0; transition: 0.4s; }

    /* Language content blocks */
    .lang-content { display: none; }
    .lang-content.active { display: block; }

    @media (max-width: 768px) {
      header { min-height: 40px; }
      nav { padding: 1rem 0; min-height: 40px; }
      .logo img { height: 100px; }

      .hamburger { display: flex; }

      .nav-links {
        display: none; flex-direction: column; background: rgba(255,255,255,0.95);
        position: absolute; top: 100%; right: 0; width: 200px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 1rem;
      }
      .nav-links.show { display: flex; }
      .nav-links a { padding: 0.5rem 0; }
    }

    /* Main offset uses dynamic header height (set by JS), with safe fallback above */
    main { padding-top: var(--header-offset); }

    /* Video area */
    .video-wrapper {
      max-width: 1280px; margin: 16px auto 0; padding: 20px; /* small extra gap above */
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid rgba(212,175,140,0.12);
    }
    .video-container {
      width: 100%; aspect-ratio: 16/9; background: #000;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; overflow: hidden;
    }
    .video-container video { width: 100%; height: 100%; object-fit: contain; }

    /* Footer */
    footer {
      background: rgba(139,115,85,0.9); color: #fff; text-align: center; padding: 2rem 0;
      backdrop-filter: blur(20px); margin-top: 40px;
    }
    .footer-content {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
    }
    .social-links a { color: #fff; font-size: 1.5rem; margin: 0 1rem; transition: 0.3s; text-decoration: none; }
    .social-links a:hover { color: #D4AF8C; transform: scale(1.2); }

    /* Loading overlay */
    .loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #FFF8F0, #F5F0E8);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .loading.fade-out { opacity: 0; pointer-events: none; }
    .loader {
      width: 60px; height: 60px; border: 3px solid #E8D5C4; border-top: 3px solid #D4AF8C;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }

    html { scroll-behavior: smooth; }
  </style>
</head>

<body>
  <!-- Loading -->
  <div class="loading" id="loading" aria-hidden="true">
    <div class="loader"></div>
  </div>

  <!-- Language toggle -->
  <div class="language-toggle" role="toolbar" aria-label="Language">
    <button onclick="switchLanguage('en')" id="en-btn" class="active">EN</button>
    <button onclick="switchLanguage('pt')" id="pt-btn">PT</button>
  </div>

  <!-- Header -->
  <header>
    <nav class="container" role="navigation" aria-label="Main navigation">
      <div class="logo">
        <a href="index.html" style="text-decoration:none;color:inherit;">
          <img src="./AmailLogo.jpeg" alt="Amai Studio Logo">
        </a>
      </div>

      <div class="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </div>

      <!-- EN nav -->
      <div class="lang-content active" data-lang="en">
        <ul class="nav-links" aria-hidden="false">
          <li><a href="index.html#home">Home</a></li>
          <li><a href="index.html#products">Products</a></li>
          <li><a href="index.html#contact">Contact</a></li>
          <li><a href="second-page.html" aria-current="page">Video</a></li>
        </ul>
      </div>

      <!-- PT nav -->
      <div class="lang-content" data-lang="pt" aria-hidden="true">
        <ul class="nav-links">
          <li><a href="index.html#home">Início</a></li>
          <li><a href="index.html#products">Produtos</a></li>
          <li><a href="index.html#contact">Contacto</a></li>
          <li><a href="second-page.html" aria-current="page">Vídeo</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- Main -->
  <main role="main" class="container">
    <section class="video-page">
      <div class="video-wrapper" role="region" aria-label="Amai Studio video player">
        <div class="video-container">
          <video controls preload="metadata" poster="">
            <source src="./20251013 - Amai Studio - Artisanal Mochi, Made with Love in Portugal.mp4" type="video/mp4">
            <track kind="captions" srclang="en" label="English captions" src="">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="lang-content active" data-lang="en">
          <p>&copy; 2024 Amai Studio. Artisanal Mochi, Made with Love in Portugal.</p>
        </div>
        <div class="lang-content" data-lang="pt">
          <p>&copy; 2024 Amai Studio. Mochi Artesanal, Feito com Amor em Portugal.</p>
        </div>
        <div class="social-links">
          <a href="https://www.instagram.com/amaistudio_portugal?igsh=OGV1cWY3azhqZHF1&utm_source=qr" target="_blank" rel="noopener">
            <img src="instagram-logo.png" alt="Instagram logo" style="width:24px;height:24px;margin-right:5px;vertical-align:middle;">
          </a>
          <a href="mailto:amai.studioportugal@gmail.com" aria-label="Email">✉️</a>
          <a href="tel:+351931875618" aria-label="Phone">📞</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Tunable extra buffer for header overlap
    const HEADER_EXTRA_BUFFER_DESKTOP = 72; // adjust if needed
    const HEADER_EXTRA_BUFFER_MOBILE  = 56; // adjust if needed
    function currentHeaderBuffer() {
      return window.innerWidth <= 768 ? HEADER_EXTRA_BUFFER_MOBILE : HEADER_EXTRA_BUFFER_DESKTOP;
    }

    // Fade out loader
    window.addEventListener('load', function () {
      const loading = document.getElementById('loading');
      if (loading) setTimeout(() => loading.classList.add('fade-out'), 700);
      setMainOffset(currentHeaderBuffer()); // measure after images/fonts load
    });

    // Dynamically set main top padding based on actual header height
    function setMainOffset(extra = 20) {
      const header = document.querySelector('header');
      const main = document.querySelector('main');
      if (!header || !main) return;
      const h = Math.ceil(header.getBoundingClientRect().height);
      const total = h + extra;
      // CSS variable for main rule + direct fallback padding
      document.documentElement.style.setProperty('--header-offset', total + 'px');
      main.style.paddingTop = total + 'px';
    }
    window.addEventListener('resize', () => setMainOffset(currentHeaderBuffer()));
    window.addEventListener('orientationchange', () => setMainOffset(currentHeaderBuffer()));

    // Language switching
    let currentLang = 'en';
    function switchLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.language-toggle button').forEach(b => b.classList.remove('active'));
      const langBtn = document.getElementById(lang + '-btn');
      if (langBtn) langBtn.classList.add('active');
      document.querySelectorAll('.lang-content').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('[data-lang="' + lang + '"]').forEach(n => n.classList.add('active'));
      setMainOffset(currentHeaderBuffer()); // recalc in case header layout changes
    }

    // Header background tweak on scroll
    window.addEventListener('scroll', function () {
      const header = document.querySelector('header');
      if (!header) return;
      header.style.background = (window.scrollY > 100) ? 'rgba(255, 255, 255, 0.98)' : 'rgba(255, 255, 255, 0.95)';
    });

    // Mobile menu toggle
    function toggleMenu() {
      const activeMenu = document.querySelector('.lang-content.active .nav-links');
      if (activeMenu) activeMenu.classList.toggle('show');
      const hamburger = document.querySelector('.hamburger');
      if (hamburger) hamburger.classList.toggle('active');
    }

    // Close mobile menu on link click
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          const activeMenu = document.querySelector('.lang-content.active .nav-links');
          const hamburger = document.querySelector('.hamburger');
          if (activeMenu && hamburger && window.innerWidth <= 768) {
            activeMenu.classList.remove('show');
            hamburger.classList.remove('active');
          }
        });
      });
    });

    // Expose functions for inline handlers
    window.toggleMenu = toggleMenu;
    window.switchLanguage = switchLanguage;
  </script>
</body>
</html>
